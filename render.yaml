services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: difference-engine-backend
    env: python
    region: singapore
    buildCommand: cd backend && pip install -r requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: difference-engine-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://difference-engine-frontend.onrender.com

  # 2. Vite + React Frontend Static Site
  - type: web
    name: difference-engine-frontend
    env: static
    region: singapore
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://difference-engine-backend.onrender.com

databases:
  # 3. PostgreSQL Database
  - name: difference-engine-db
    region: singapore
    databaseName: attendiq
    user: attendiq_user